[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "worldforge-engine"
version = "0.2.0"
description = "Stateful synthetic worlds for reproducible agent evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "WorldForge contributors"}]
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "hypothesis>=6.125,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6.0.12", "types-jsonschema>=4.23", "build>=1.2,<2"]

[project.scripts]
worldforge = "worldforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/worldforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/worldforge"]

